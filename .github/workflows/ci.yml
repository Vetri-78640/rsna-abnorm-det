name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install --quiet numpy pandas
      - name: tests
        run: ./run_tests.sh
      - name: wiki lint
        run: python3 wiki/lint.py
      - name: docs updated with the code
        if: github.event_name == 'pull_request'
        run: scripts/check_docs_updated.sh origin/${{ github.base_ref }}
